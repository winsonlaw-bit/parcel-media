description: >
  NJV · SG 跨境需求情报工作台：基于 H1 2026 真实妥投包裹（约 3.26M 件）的 SG 跨境
  需求情报可视化工作台。纯静态前端（需求地图 / 动态需求 / 货主屏 / 配送员屏 / 品类全景 /
  信号层）以 iframe 挂载离线底图与真实产物；后端仅提供健康探针与 /api 占位，无数据库。

