<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>谁看过这个工作台 · 访问记录</title>
<style>
  :root{ --brand:#1d4ed8; --ink:#0f172a; --sub:#64748b; --line:#e2e8f0; --bg:#f8fafc; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);padding:28px}
  .wrap{max-width:960px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--sub);font-size:13px;margin:0 0 18px;line-height:1.6}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .card .v{font-size:26px;font-weight:700;color:var(--brand)}
  .card .l{font-size:12.5px;color:var(--sub);margin-top:4px}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  th,td{padding:11px 14px;text-align:left;font-size:13.5px;border-bottom:1px solid var(--line)}
  th{background:#f1f5f9;color:var(--sub);font-weight:600}
  tr:last-child td{border-bottom:none}
  td.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
  .pill{display:inline-block;background:#eef2ff;color:var(--brand);border-radius:999px;padding:2px 10px;font-size:12px}
  .err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;padding:14px 16px;border-radius:12px;font-size:13.5px;line-height:1.6}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .tag{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px}
  button{cursor:pointer;border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:10px;padding:8px 14px;font-size:13px;margin-bottom:16px}
  @media(max-width:640px){ .cards{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <h1>谁看过这个工作台</h1>
  <p class="sub">访问记录来自 SSO 实名（登录邮箱），按「访客 × 看了哪个 tab」记录，仅团队内部可见。同一人同一 tab 10 分钟内只记一次（避免刷新刷屏）。</p>
  <button onclick="load()">刷新</button>
  <div id="out"></div>
</div>
<script>
const TAB_LABEL = { guide:'总结', chassis:'数据底盘', geo:'流量地图', merchant:'货主屏', driver:'配送员屏', unknown:'未知' };
function fmtTab(t){ return TAB_LABEL[t] || t; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function render(d){
  var byTab = d.byTab || {};
  var tags = Object.keys(byTab).map(function(t){ return '<span class="tag">'+esc(fmtTab(t))+' · '+byTab[t]+'</span>'; }).join('');
  var rows = (d.recent||[]).map(function(r){
    return '<tr><td>'+esc(r.at)+'</td><td class="mono">'+esc(r.actor)+'</td><td><span class="pill">'+esc(fmtTab(r.tab))+'</span></td></tr>';
  }).join('');
  document.getElementById('out').innerHTML =
    '<div class="cards">'+
      '<div class="card"><div class="v">'+esc(d.total)+'</div><div class="l">总访问次数</div></div>'+
      '<div class="card"><div class="v">'+esc(d.uniqueActors)+'</div><div class="l">独立访客（实名）</div></div>'+
      '<div class="card"><div class="v">'+Object.keys(byTab).length+'</div><div class="l">被查看的 tab 数</div></div>'+
    '</div>'+
    (tags?'<div class="bar">'+tags+'</div>':'')+
    '<table><thead><tr><th>时间 (UTC)</th><th>访客（SSO 实名）</th><th>看了哪个 tab</th></tr></thead><tbody>'+rows+'</tbody></table>';
}
function load(){
  document.getElementById('out').innerHTML = '<p class="sub">加载中…</p>';
  fetch('/api/visits?limit=300').then(function(r){
    if(!r.ok){ if(r.status===401) throw new Error('未登录（需要 SSO）'); if(r.status===403) throw new Error('仅管理员可查看'); throw new Error('接口返回 '+r.status); }
    return r.json();
  }).then(render).catch(function(e){
    document.getElementById('out').innerHTML = '<div class="err">无法加载访问记录：'+esc(e.message)+'。<br>请确认你已通过 SSO 登录；本地 file:// 打开时后端不可用，需在线上查看。</div>';
  });
}
load();
</script>
</body>
</html>
