# Serve the static workbench: files with a fallback to index.html for client-side
# routes. /api is routed to the backend by the Ingress, so it never reaches nginx.
#
# Do NOT add a `location /api/ { proxy_pass http://backend:8000; }` block here for
# local docker-compose. nginx resolves upstream hostnames when it loads this file, so
# a name that does not exist in the app's namespace ("backend") makes nginx refuse to
# start at all. For compose, keep a separate compose-only nginx config.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ⚠️ CRITICAL: never cache any response. A prior OSM "Access blocked" outage was
    # caused by the edge/CDN serving STALE builds of index.html (which still pointed
    # at an old OSM-tile iframe). `no-store` forces every browser AND intermediary
    # to re-fetch from origin on each load, so a new deploy is always reflected.
    add_header Cache-Control "no-store";

    location / {
        try_files $uri $uri/ /index.html;
    }
}
