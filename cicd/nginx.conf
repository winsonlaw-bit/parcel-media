# Serve the static workbench: files with a fallback to index.html for client-side
# routes. /api is routed to the backend by the Ingress, so it never reaches nginx.
#
# Do NOT add a `location /api/ { proxy_pass http://backend:8000; }` block here for
# local docker-compose. nginx resolves upstream hostnames when it loads this file, so
# a name that does not exist in the app's namespace ("backend") makes nginx refuse to
# start at all. For compose, keep a separate compose-only nginx config.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static demo app with no build step or hashed asset names: serve every response
    # with no-store so a deploy is reflected immediately. The SSO ingress already
    # sets no-store on authenticated responses; this keeps origin behaviour aligned.
    # (Production note: with a real build step, prefer fingerprinted assets +
    # `immutable` long-cache, and no-store only on the HTML entry point.)
    add_header Cache-Control "no-store";

    location / {
        try_files $uri $uri/ /index.html;
    }
}
